name: Downstream
on:
  push:
    branches: [master, develop]
    tags: [v*]
  pull_request:

jobs:
  test:
    name: ${{ matrix.package.user }}/${{ matrix.package.repo }}
    runs-on: ${{ matrix.os }}
    env:
      GROUP: ${{ matrix.package.group }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: [1]
        os: [ubuntu-latest]
        package:
          - {user: BioJulia, repo: BED.jl, group: BioGenerics}
          - {user: BioJulia, repo: BioAlignments.jl, group: BioGenerics}
          - {user: BioJulia, repo: BioStructures.jl, group: BioGenerics}
          - {user: BioJulia, repo: FASTX.jl, group: BioGenerics}
          - {user: BioJulia, repo: GenomicAnnotations.jl, group: BioGenerics}
          - {user: BioJulia, repo: GenomicFeatures.jl, group: BioGenerics}
          - {user: BioJulia, repo: GFF3.jl, group: BioGenerics}
          - {user: BioJulia, repo: Indexes.jl, group: BioGenerics}
          - {user: BioJulia, repo: SequenceVariation.jl, group: BioGenerics}
          - {user: BioJulia, repo: TwoBit.jl, group: BioGenerics}
          - {user: BioJulia, repo: XAM.jl, group: BioGenerics}
          - {user: ksumngs, repo: HapLink.jl, group: BioGenerics}
          - {user: rasmushenningsson, repo: VariantCallFormat.jl, group: BioGenerics}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/julia-buildpkg@v1
      - name: Clone Downstream
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
          path: downstream
      - name: Load this and run the downstream tests
        shell: julia --color=yes --project=downstream {0}
        run: |
          using Pkg
          try
            # force it to use this PR's version of the package
            Pkg.develop(PackageSpec(path="."))  # resolver may fail with main deps
            Pkg.update()
            Pkg.test()  # resolver may fail with test time deps
          catch err
            err isa Pkg.Resolve.ResolverError || rethrow()
            # If we can't resolve that means this is incompatible by SemVer and this is fine.
            # It means we marked this as a breaking change, so we don't need to worry about.
            # Mistakenly introducing a breaking change, as we have intentionally made one.
            @info "Not compatible with this release. No problem." exception=err
            exit(0)  # Exit immediately, as a success
          end